# The build path is `make` (see the Makefile): it builds the Rust app in desktop/ and this
# AUv3 extension, and assembles AudioCurve.app. This file generates an Xcode project for the
# extension alone, and the settings block below is the single source of the version numbers,
# which the Makefile reads.
name: audiocurve
options:
  bundleIdPrefix: se.lindefors
  # English is the development language: code uses English keys, and locales without a
  # translation fall back to it. Translations live in each target's Localizable.xcstrings.
  developmentLanguage: en
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  AudioCurveCore:
    path: Packages/AudioCurveCore
targets:
  AudioCurveAU:
    type: app-extension
    platform: macOS
    sources: [AU]
    dependencies:
      - package: AudioCurveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.lindefors.audiocurve.AudioCurveAU
        INFOPLIST_FILE: AU/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AU/AudioCurveAU.entitlements
        OTHER_LDFLAGS: "-L$(SRCROOT)/dsp/target/aarch64-apple-darwin/release -laudiocurve_dsp"
    preBuildScripts:
      - name: Build Rust DSP
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"; cd "$SRCROOT/dsp" && cargo build --release --target aarch64-apple-darwin
schemes:
  AudioCurveAU:
    build:
      targets:
        AudioCurveAU: all
    run:
      config: Debug
