[package]
name = "audiocurve-core"
version = "0.1.0"
edition = "2024"
description = "Platform-independent AudioCurve logic: prescription, hearing test, profiles, outputs, route state."

[lib]
name = "audiocurve_core"


[dependencies]
audiocurve-dsp = { path = "../dsp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
